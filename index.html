<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPL T20 Analytics Dashboard</title>

<style>
body{
    margin:0;
    background:#0b1f5b;
    font-family:Arial,sans-serif;
    color:white;
}

.header{
    text-align:center;
    padding:20px;
    background:#102a72;
    font-size:32px;
    font-weight:bold;
}

.cards{
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
    padding:20px;
}

.card{
    background:#102a72;
    padding:20px;
    border-radius:15px;
    width:220px;
    text-align:center;
    box-shadow:0 0 15px cyan;
}

.value{
    font-size:50px;
    font-weight:bold;
}

.preview{
    text-align:center;
    padding:30px;
}

.preview img{
    width:80%;
    border-radius:10px;
}
</style>

</head>

<body>

<div class="header">
🏏 IPL T20 ANALYTICS DASHBOARD 🏏
</div>

<div class="cards">

<div class="card">
<h2>Matches Played</h2>
<div class="value">22</div>
</div>

<div class="card">
<h2>Total Runs</h2>
<div class="value">8,122</div>
</div>

<div class="card">
<h2>Total Wickets</h2>
<div class="value">266</div>
</div>

<div class="card">
<h2>Teams</h2>
<div class="value">10</div>
</div>

</div>

<div class="preview">
<h2>Dashboard Preview</h2>
<img src="dashboard.png">
</div>

</body>
</html>
